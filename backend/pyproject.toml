[project]
name = "watiq-api"
version = "0.1.0"
description = "Watiq (وثيق) — Tunisia's national portal for public legal services"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "email-validator>=2.2",   # pydantic EmailStr
    "pydantic-settings>=2.6",
    "redis[hiredis]>=5.2",
    "arq>=0.26",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44.0",
    "pyotp>=2.9",
    "aioboto3>=13.2",
    "python-multipart>=0.0.18",
    "structlog>=24.4",
    "orjson>=3.10",
    "jsonschema>=4.23",
    "python-magic>=0.4.27",
    "pillow>=11.0",            # scan_document EXIF stripping (Backend.md §9)
    "httpx>=0.27",             # reconcile_payments gateway polling
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",
    "schemathesis>=3.35",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["app.core.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "argon2.*", "asyncpg.*", "aioboto3.*", "arq.*", "testcontainers.*",
    "schemathesis.*", "magic", "pytest_asyncio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Everything async here is function-scoped, fixtures included. An asyncpg
# connection is bound to the loop that created it, and mixing a session-scoped
# engine with per-function test loops produces "attached to a different loop"
# and "Runner.run() cannot be called from a running event loop". Engines are
# lazy, so rebuilding them per test costs almost nothing and removes the
# entire class of problem.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "security: security regression suite (deselect with '-m \"not security\"')",
    "integration: needs live Postgres/Redis testcontainers",
]
