# Redis configuration for Watiq (Security.md §10.2).
#
# Redis holds NO citizen PII by policy (ADR-003, Backend.md §5.1). That is a
# deliberate design property, not an accident: it means a full Redis compromise
# costs cache poisoning and rate-limit bypass — serious, but not a citizen-data
# breach. tests/security/test_no_pii_in_cache.py is what keeps it true.

bind 0.0.0.0
protected-mode yes

# The plaintext port is DISABLED, not merely firewalled. `port 0` means there is
# no cleartext listener to reach at all.
port 0
tls-port 6379
tls-cert-file /tls/redis.crt
tls-key-file  /tls/redis.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients yes                    # mutual TLS: the client proves itself too
tls-protocols "TLSv1.3"

aclfile /etc/redis/users.acl

maxmemory 2gb
maxmemory-policy allkeys-lru            # cache only; eviction is acceptable

# --- Commands with no legitimate use here ---------------------------------
# Renaming to "" removes the command entirely. Each of these is either a
# one-command outage or a one-command reconnaissance tool.
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
rename-command SHUTDOWN ""
rename-command KEYS     ""              # O(N) blocking scan = trivial DoS
rename-command MODULE   ""
rename-command REPLICAOF ""             # would repoint the cache at an attacker
rename-command SLAVEOF  ""

# --- Persistence: none -----------------------------------------------------
# Nothing in this cache needs to survive a restart, and disabling persistence
# means no citizen-adjacent data is ever written to disk where a stolen volume
# or a stale backup could reveal it. A cold cache is a performance event, not a
# correctness one.
appendonly no
save ""

# --- Bounds ----------------------------------------------------------------
timeout 300
tcp-keepalive 60
maxclients 1000

# A slow command is a blocked event loop. Log anything over 10ms so a bad Lua
# script or an accidental O(N) call is visible before it becomes an outage.
slowlog-log-slower-than 10000
slowlog-max-len 256

# Lua scripts are used for the single-flight cache lock and for atomic
# rate-limit counters; bound their runtime so a buggy one cannot wedge Redis.
busy-reply-threshold 5000

loglevel notice
logfile ""
