# pgBackRest configuration for Watiq (Security.md §15).
#
# Targets:
#   RPO  <= 5 minutes   (continuous WAL archiving)
#   RTO  <= 2 hours
#   Full backup weekly, differential daily, WAL continuous
#   Retention: 4 full local, 8 full offsite
#
# repo1-cipher-pass is substituted from Docker secrets / Vault at deploy time
# (docs/runbooks/secret-rotation.md). If this passphrase is lost, the backups
# are unrecoverable — it is escrowed separately from the backup storage itself,
# because storing the key beside the ciphertext is not encryption.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=__FROM_SECRET__
repo1-retention-full=4
repo1-retention-diff=7

# Offsite, national datacenter #2. A backup in the same building as the primary
# protects against disk failure and nothing else — not fire, not flood, and not
# an attacker who reached the rack.
repo2-type=s3
repo2-s3-bucket=watiq-backups
repo2-s3-endpoint=backup.dc2.watiq.tn
repo2-s3-region=tn-central
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=__FROM_SECRET__
repo2-retention-full=8

process-max=4
compress-type=zst
compress-level=6
start-fast=y

# Verify the checksum of every restored file. A silently corrupt backup is
# indistinguishable from a good one until the day it is needed.
repo1-bundle=y
archive-async=y
archive-get-queue-max=1GB
archive-push-queue-max=4GB

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[watiq]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=watiq_backup
