# Watiq server blocks — Layer 2 edge (Security.md §3.1).
#
# The rate-limit zones, the log format and the `watiq_api` upstream are declared
# in ../nginx.conf (http context); they cannot live here.

# Trust ONLY the Docker edge network for X-Forwarded-For.
#
# This is the whole game for per-IP controls. Trusting XFF from anywhere lets a
# client send its own header and become any address it likes — defeating the
# rate limits below, CrowdSec's decisions, and the access_log attribution used
# to investigate an incident.
set_real_ip_from 172.20.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# Unmatched Host headers land here and get nothing. Without a default_server
# that closes the connection, a request for any hostname resolving to this box
# is served by the first server block, which is how vhost confusion starts.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    include snippets/tls.conf;
    return 444;                     # close without a response
}

server {
    listen 80;
    listen [::]:80;
    server_name watiq.tn www.watiq.tn;
    return 301 https://watiq.tn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name watiq.tn;

    include snippets/tls.conf;
    include snippets/security-headers.conf;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

    server_tokens off;

    client_max_body_size 12m;          # > max_upload_bytes (10m), < absurd
    client_body_timeout  10s;
    client_header_timeout 10s;
    send_timeout         30s;
    keepalive_timeout    30s;

    limit_conn perip 50;
    limit_req  zone=general burst=60 nodelay;
    limit_req_status 429;

    # Only the verbs the API actually uses. TRACE and friends never reach the
    # application, so a misconfigured upstream cannot be made to echo headers.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Static assets: hashed, immutable, and served without touching Python.
    # These are the only responses on this vhost that may be cached publicly —
    # security-headers.conf sets no-store for everything else because a cached
    # request detail on a shared municipal terminal is a disclosure.
    location /static/ {
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # The API keeps its own prefix. Everything under it is JSON.
    location /api/ {
        proxy_pass http://watiq_api;
        include snippets/proxy-common.conf;
    }

    # Everything else is the server-rendered frontend.
    location / {
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
    }

    # Credential stuffing is the highest-volume attack against this endpoint.
    # 10r/m per IP is far above a human and far below a botnet; CrowdSec bans
    # the distributed case that slips under it.
    #
    # THE BROWSER-FACING FORM IS THE ONE THAT MATTERS NOW. With the BFF in
    # front, a person signing in POSTs to /login here; the call to
    # /api/v1/auth/login is then made server-to-server from the frontend
    # container, so it arrives with the frontend's address and this zone would
    # see one client for every citizen in the country. The API-path limits
    # below are kept for direct API clients (native apps), but the limit that
    # actually stops credential stuffing through the website is this one.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
    }

    location = /register {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
    }

    location = /password-reset {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
    }

    # Tracking-code lookup needs no session, so it is the natural place to
    # enumerate codes. CrowdSec's watiq/tracking-enum scenario watches this;
    # the zone below is the blunt cap underneath it.
    location = /track {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://watiq_frontend;
        include snippets/proxy-common.conf;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://watiq_api;
        include snippets/proxy-common.conf;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://watiq_api;
        include snippets/proxy-common.conf;
    }

    location ~ ^/api/v1/(requests/[0-9]+/documents|documents) {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://watiq_api;
        include snippets/proxy-common.conf;
    }

    # Internal-only endpoints must never be reachable from outside. 404 rather
    # than 403 so their existence is not confirmed.
    location ~ ^/(healthz|readyz|metrics)$ {
        deny all;
        return 404;
    }

    # No interactive API docs in production. The OpenAPI document is a complete
    # map of every endpoint and parameter — useful to a reviewer, and just as
    # useful to someone enumerating the attack surface.
    location ~ ^/(docs|redoc|openapi.json)$ {
        deny all;
        return 404;
    }

    # Hidden files, VCS metadata and editor droppings. A leaked .env or .git
    # directory is a full credential compromise.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
