# Watiq — nginx main context (Structure.md §5: "worker/TLS/log core").
#
# The server blocks live in conf.d/watiq.conf; the reusable pieces in
# snippets/. This file owns only what must be set outside a server block.
#
# Mounted read-only at /etc/nginx/nginx.conf (docker-compose.prod.yml).
# Validate with:  nginx -t

user  nginx;
worker_processes auto;
worker_rlimit_nofile 16384;

# ModSecurity is compiled in as a dynamic module in the WAF image. Loading it
# here rather than per-server keeps the rule engine available to every vhost,
# including the default_server that catches unmatched Host headers.
load_module modules/ngx_http_modsecurity_module.so;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Do not advertise anything -----------------------------------------
    # Version disclosure turns "scan the internet for vulnerable nginx" into a
    # targeted list. Free to remove, so remove it.
    server_tokens off;

    # --- Logging ------------------------------------------------------------
    # $request_id is generated by nginx and forwarded to the API as
    # X-Request-ID, so one identifier joins the WAF log, the application log and
    # the access_log row for the same request (Security.md §14).
    #
    # Deliberately absent: $request_body, $http_authorization, $http_cookie and
    # the query string. A national portal's access log must not become the
    # place where CIN numbers and refresh tokens are retained in plaintext.
    log_format watiq_json escape=json
      '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer",'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"tls_version":"$ssl_protocol",'
        '"tls_cipher":"$ssl_cipher"'
      '}';

    access_log /var/log/nginx/access.log watiq_json;

    # --- Transfer -----------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;

    # --- Timeouts: every hop bounded (Security.md §13.1) --------------------
    # An unbounded read is a free slowloris slot. These are duplicated in the
    # server block because a future vhost must not silently inherit nothing.
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     30s;
    send_timeout          30s;
    reset_timedout_connection on;

    # --- Request size limits ------------------------------------------------
    client_max_body_size    12m;   # > max_upload_bytes (10m), < absurd
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;

    # --- Compression --------------------------------------------------------
    # gzip is OFF for proxied responses. BREACH exploits compression of a
    # response containing both attacker-controlled input and a secret; the CSRF
    # token is exactly that. Static assets are served by the SPA's CDN/bundle,
    # not from here, so there is nothing to gain by enabling it.
    gzip off;

    # --- Rate-limit and connection zones ------------------------------------
    # Declared here (http context) and applied in conf.d/watiq.conf. CrowdSec
    # handles behavioural bans; these are the blunt caps that hold the line
    # before any decision has been made.
    limit_req_zone  $binary_remote_addr zone=general:20m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=upload:10m  rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- Upstream -----------------------------------------------------------
    # keepalive to the API avoids a TCP handshake per request. The resolver is
    # Docker's embedded DNS so a replaced api container is picked up without a
    # reload.
    upstream watiq_api {
        server watiq-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # The server-rendered frontend (BFF). It holds the session and calls the API
    # itself, so browser traffic terminates here for everything except /api/.
    upstream watiq_frontend {
        server watiq-frontend:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
