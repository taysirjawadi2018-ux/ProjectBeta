# Response security headers (Security.md §3.3).
#
# `always` matters: without it these are omitted on error responses, and a 500
# or a 404 is exactly where an attacker would like the framing and sniffing
# protections to disappear.
#
# NOTE on inheritance: add_header does NOT accumulate across nesting levels. A
# `location` block that adds even one header of its own discards every header
# set here. Any new location that needs its own header must re-include this
# file.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Single-origin SPA. No inline script, no external origins, no framing.
# 'unsafe-inline' is absent from script-src and must stay absent: that single
# omission is the most effective XSS control available here, and it is
# affordable only because the SPA is bundled rather than templated.
# geolocation is retained in Permissions-Policy because "nearest office that
# does X" needs it.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# API responses. Caching a citizen's request detail in a shared proxy — or in
# the browser of a shared municipal terminal — is a disclosure. Static assets
# are served elsewhere and set their own policy.
add_header Cache-Control "no-store" always;
