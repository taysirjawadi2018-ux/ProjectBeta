# Shared proxy directives (Security.md §3.1).
#
# `location` blocks do NOT inherit proxy_set_header from a sibling location, so
# every location that proxies must include this. Without it, the login and
# upload routes would silently lose X-Forwarded-For — and the API would rate
# limit, log and ban by the *proxy's* address instead of the client's, turning
# per-IP controls into a single shared bucket for the whole country.

proxy_http_version 1.1;

# Empty Connection header enables upstream keepalive (see `upstream watiq_api`).
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Joins the WAF log, the app log and the access_log row for one request.
proxy_set_header X-Request-ID      $request_id;

# Timeouts at every hop (Security.md §13.1). read_timeout is deliberately
# shorter than the API's own worker timeout so nginx gives up first and returns
# 504 rather than holding the connection while the worker is already gone.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_buffering on;
proxy_buffers 16 8k;
proxy_buffer_size 8k;
proxy_busy_buffers_size 16k;

# Do not retry a non-idempotent request against another upstream: a retried
# POST /payments would charge a citizen twice. Idempotency-Key protects the
# application layer, but the proxy should not be creating the duplicate.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

# The API must never leak its own server banner or a duplicate CORS header
# through the WAF; the values in security-headers.conf are authoritative.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
