<!--
  Wazuh agent — Layer 5 HIDS / FIM (Security.md §6).

  Suricata watches the network; Wazuh watches the host. This is what detects a
  webshell, a modified binary, or a container escape — the things that leave no
  distinctive packet on the wire.

  The host auditd ruleset that feeds the localfile block below ships alongside
  this file as ops/wazuh/audit-rules.watiq; install it to
  /etc/audit/rules.d/watiq.rules and reload with augenrules. The exact commands
  are in the header of audit-rules.watiq itself, because an XML comment cannot
  contain a double hyphen and so cannot quote the flag.
-->
<ossec_config>

  <syscheck>
    <frequency>3600</frequency>
    <alert_new_files>yes</alert_new_files>
    <scan_on_start>yes</scan_on_start>

    <!--
      Application code must never change at runtime. It is a read-only container
      image (docker-compose.prod.yml sets read_only: true), so any modification
      here means arbitrary code execution has already happened.
      realtime="yes" because an hourly scan is too slow to matter for a webshell.
    -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/watiq/app</directories>
    <directories check_all="yes" realtime="yes">/opt/watiq/ops</directories>
    <directories check_all="yes" realtime="yes">/etc/nginx,/etc/nftables.conf</directories>
    <directories check_all="yes" realtime="yes">/etc/ssh,/etc/pam.d,/etc/sudoers.d</directories>
    <directories check_all="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!--
      report_changes is deliberately NOT set on the secrets path: it would put
      a diff of the secret into the alert, which relocates the secret into the
      alerting system. Presence and mtime only.
    -->
    <directories check_all="yes" realtime="yes" report_changes="no">/run/secrets</directories>

    <ignore type="sregex">^/opt/watiq/app/.*\.pyc$</ignore>
    <ignore>/opt/watiq/app/__pycache__</ignore>
    <ignore>/var/log</ignore>
  </syscheck>

  <rootcheck>
    <frequency>7200</frequency>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <!-- Suricata's EVE output, correlated with host events in the same pipeline. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- The structured application log (PII-redacted at source, §14.1). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/watiq/app.json</location>
  </localfile>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/modsec_audit.log</location>
  </localfile>

  <!--
    Alerts go to a manager the local operator does not administer. An operator
    who can delete the evidence of their own actions is not audited
    (Security.md §17, "compromised privileged operator").
  -->
  <client>
    <server>
      <address>wazuh-manager.internal</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>30</notify_time>
    <time-reconnect>60</time-reconnect>
  </client>

  <!--
    Active response is intentionally NOT enabled for these rules. Automatic
    host-level remediation on a national portal is how a false positive becomes
    a nationwide outage; CrowdSec owns actuation, at the network edge, where a
    wrong decision is reversible.
  -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

</ossec_config>
