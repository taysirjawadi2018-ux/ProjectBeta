# Watiq-specific WAF rules (Security.md §3.5).
#
# These are positive-security rules: they assert what a valid request looks
# like for a route, rather than enumerating what an attack looks like. That is
# strictly stronger, and it is only possible because these formats are fixed by
# the schema.
#
# Loaded after CRS (99- prefix) so these decisions are final.

# Tracking codes are WTQ-YYYY-XXXXXXXXXX (fn_requests_before_insert generates
# 5 random bytes as 10 uppercase hex chars). Anything else on this route is
# probing, so fail it before it reaches the app.
SecRule REQUEST_URI "@rx ^/api/v1/requests/track/(.*)$" \
    "id:1100,phase:1,deny,status:400,log,\
     msg:'Malformed tracking code',chain"
    SecRule TX:1 "!@rx ^WTQ-20[0-9]{2}-[0-9A-F]{10}$" "t:none"

# CIN must be exactly 8 digits (chk_users_national_id_format). Reject anything
# else at the edge so the enumeration attempt never reaches a query.
SecRule ARGS:national_id "!@rx ^[0-9]{8}$" \
    "id:1101,phase:2,deny,status:400,log,msg:'Malformed national_id'"

# Nobody legitimately requests these. The scanner_score counter is what
# CrowdSec's http-probing scenario consumes to ban a persistent prober.
SecRule REQUEST_URI "@rx (?i)/(\.git|\.env|wp-admin|phpmyadmin|\.aws|\.ssh|actuator|_profiler)" \
    "id:1102,phase:1,deny,status:404,log,msg:'Scanner path probe',\
     setvar:ip.scanner_score=+1,expirevar:ip.scanner_score=300"

# Tunisian MSISDN in E.164 (chk_users_phone_format).
SecRule ARGS:phone "!@rx ^\+216[0-9]{8}$" \
    "id:1103,phase:2,deny,status:400,log,msg:'Malformed phone'"

# A response carrying many CIN-shaped values is either a bulk export nobody
# asked for, or exfiltration. Response bodies are not inspected (§3.4), so this
# is a detection hook for Suricata sid:9000020 rather than a block — recorded
# here so the two layers are read together.
#     see ops/suricata/rules/watiq.rules

# Content-Type must match what the route accepts. A JSON endpoint receiving
# multipart is either a parser-confusion attempt or a broken client.
SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" \
    "id:1104,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@beginsWith /api/v1/auth" "chain"
    SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json" \
        "t:none,t:lowercase,deny,status:415,log,msg:'Unexpected content type on auth route'"
