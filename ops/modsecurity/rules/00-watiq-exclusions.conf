# CRS false-positive exclusions for Watiq (Security.md §3.5).
#
# This is the realistic tuning burden for THIS application, and skipping it is
# why WAFs get switched off.
#
# THE RULE FOR THIS FILE: every exclusion is narrowly scoped to one route and
# one parameter, and every one states which compensating control replaces it.
# A blanket `SecRuleRemoveById` is how a WAF becomes theatre.
#
# Loaded before the CRS rules themselves (00- prefix), because ctl: actions must
# be set in an earlier phase than the rule they disable.

# --- 1. Arabic / French UTF-8 -------------------------------------------
# service_catalog names are Arabic and French with accents. CRS byte-range and
# encoding rules (920272-920274) flag both.
# Compensating control: this route is read-only public catalogue data. There is
# no citizen input and no write path behind it.
SecRule REQUEST_URI "@beginsWith /api/v1/services" \
    "id:1000,phase:1,pass,nolog,t:none,\
     ctl:ruleRemoveById=920272,\
     ctl:ruleRemoveById=920273,\
     ctl:ruleRemoveById=920274"

# --- 2. Apostrophes in French text --------------------------------------
# "Certificat d'hebergement" trips SQLi heuristics on the apostrophe.
# Narrowly scoped to the free-text fields that legitimately contain them.
# Compensating control: every statement is parameterized (Security.md §9), so
# an apostrophe is data, not syntax. Semgrep bans f-string SQL in CI.
SecRule REQUEST_URI "@rx ^/api/v1/(requests|appointments)" \
    "id:1001,phase:2,pass,nolog,t:none,\
     ctl:ruleRemoveTargetById=942100;ARGS:reason,\
     ctl:ruleRemoveTargetById=942100;ARGS:notes,\
     ctl:ruleRemoveTargetById=942190;ARGS:reason"

# --- 3. form_data JSONB ---------------------------------------------------
# Arbitrary nested JSON with citizen names and addresses. CRS cannot usefully
# reason about it.
# Compensating control: app/modules/requests/formdata.py validates this exact
# parameter against a per-service JSON Schema with additionalProperties:false,
# plus hard caps on size, depth, key count and string length (Security.md §8.2).
# An allow-list schema is STRONGER than a regex over arbitrary JSON — but only
# while it runs. tests/unit/test_formdata.py is what keeps this exclusion safe.
SecRule REQUEST_URI "@rx ^/api/v1/requests" \
    "id:1002,phase:2,pass,nolog,t:none,\
     ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.form_data,\
     ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.form_data"

# --- 4. Base64 document checksums / presigned URL params ----------------
# A SHA-256 in base64 looks like encoded-payload evasion to 920273.
# Compensating control: the checksum is verified server-side against the actual
# object bytes; a forged value fails that comparison.
SecRule REQUEST_URI "@beginsWith /api/v1/documents" \
    "id:1003,phase:2,pass,nolog,t:none,\
     ctl:ruleRemoveTargetById=920273;ARGS:checksum_sha256"
