# ModSecurity v3 engine configuration — Layer 2 WAF (Security.md §3.4).
#
# Loaded by nginx via `modsecurity_rules_file` in conf.d/watiq.conf.
# The OWASP CRS itself is expected at /etc/nginx/modsecurity/crs/.

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 262144
SecRequestBodyLimitAction Reject

# Response bodies are not inspected: nothing here needs it, and buffering a
# presigned document download through the WAF would be both slow and a place
# where citizen PII sits in a buffer it does not need to sit in.
SecResponseBodyAccess Off

SecArgumentSeparator &
SecCookieFormat 0
SecUnicodeMapFile unicode.mapping 20127
SecTmpDir /tmp/modsecurity
SecDataDir /tmp/modsecurity

# The container runs read_only with a tmpfs at /tmp (docker-compose.prod.yml),
# so both directories above are writable without making the image writable.

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# Parse JSON bodies so CRS inspects them properly (this API is JSON-first).
# Without this the entire body is one opaque ARGS value and every CRS rule that
# targets a named parameter silently matches nothing — a WAF that appears to be
# running while inspecting almost nothing.
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,pass,t:none,t:lowercase,nolog,ctl:requestBodyProcessor=JSON"

Include /etc/nginx/modsecurity/crs-setup.conf
Include /etc/nginx/modsecurity/rules/*.conf
Include /etc/nginx/modsecurity/crs/rules/*.conf
