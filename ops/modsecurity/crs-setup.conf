# OWASP CRS 4.x tuning for Watiq (Security.md §3.4).
#
# Paranoia level 2 BLOCKING, level 3 DETECTING.
#
# PL3+ blocking on a portal carrying Arabic and French free text produces a
# false-positive rate that gets the WAF switched off by an exhausted operator —
# which is strictly worse than PL2. Run PL3 in detection for a month, review
# ops/modsecurity audit logs, then promote whatever is clean.

SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=2"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.detection_paranoia_level=3"

# Block at 5 inbound / 4 outbound anomaly points (CRS defaults).
SecAction "id:900110,phase:1,nolog,pass,t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# Must stay in step with the `if ($request_method !~ ...)` guard in
# conf.d/watiq.conf. Two lists that disagree is how a verb gets through one
# layer and not the other.
SecAction "id:900200,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST PATCH PUT DELETE OPTIONS'"

SecAction "id:900220,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_request_content_type=application/json|application/x-www-form-urlencoded|multipart/form-data'"

# Arabic and French are first-class content here, not anomalies. Restricting the
# allowed charset to ASCII would reject a correctly-spelled Tunisian name.
SecAction "id:900230,phase:1,nolog,pass,t:none,\
  setvar:'tx.allowed_request_content_type_charset=utf-8|iso-8859-1'"

# Sampling off: this is a government portal, not a CDN. Every request is
# inspected.
SecAction "id:900400,phase:1,nolog,pass,t:none,setvar:tx.sampling_percentage=100"

# X-Forwarded-For is only trustworthy because nginx rewrote it from the edge
# network (set_real_ip_from in conf.d/watiq.conf). Do not widen that trust here.
SecAction "id:900450,phase:1,nolog,pass,t:none,setvar:tx.real_ip=%{remote_addr}"
