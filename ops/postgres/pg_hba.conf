# PostgreSQL host-based authentication for Watiq (Security.md §10.1).
#
# Mounted read-only at /etc/postgresql/pg_hba.conf.
#
# Rules are evaluated TOP TO BOTTOM and the FIRST match wins — including a
# first match that rejects. The two reject lines at the bottom are the default
# deny; nothing may be added below them.
#
# `hostssl`, not `host`: a `host` line would accept an unencrypted connection,
# and on the data network that means credentials and citizen rows in cleartext
# between containers. There is no non-TLS path here at all.
#
# 172.21.0.0/16 is the watiq_data Docker network. Adjust if the compose network
# addressing changes — and if it does, ops/nginx/conf.d/watiq.conf's
# set_real_ip_from needs the *edge* network, which is a different subnet.

# TYPE   DATABASE  USER                 ADDRESS        METHOD

# --- The five application roles. None owns any object, so RLS applies. -----
hostssl  watiq     watiq_app_citizen    172.21.0.0/16  scram-sha-256
hostssl  watiq     watiq_app_staff      172.21.0.0/16  scram-sha-256
hostssl  watiq     watiq_app_auth       172.21.0.0/16  scram-sha-256
hostssl  watiq     watiq_app_auditor    172.21.0.0/16  scram-sha-256
hostssl  watiq     watiq_app_admin      172.21.0.0/16  scram-sha-256

# --- The migration user owns the schema and must NEVER serve traffic. ------
# It is listed here because Alembic needs it, and it is a separate role
# precisely so that "can migrate" and "can serve requests" are different
# credentials (ADR-001).
hostssl  watiq     watiq_migrate        172.21.0.0/16  scram-sha-256

# --- Backup: pgBackRest needs replication, and nothing else. ---------------
hostssl  replication  watiq_backup      172.21.0.0/16  scram-sha-256

# --- Default deny ----------------------------------------------------------
# `local ... reject` closes the Unix socket. Without it, anyone who reaches a
# shell inside the container is `postgres` via peer auth — superuser, RLS
# exempt, no password required. This one line is what makes a container
# breakout not automatically a total data breach.
local    all       all                                 reject
host     all       all                  0.0.0.0/0      reject
host     all       all                  ::/0           reject
