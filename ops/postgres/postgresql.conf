# PostgreSQL configuration for Watiq (Security.md §10.1).
#
# Mounted read-only at /etc/postgresql/postgresql.conf; loaded via
# `-c config_file=` in docker-compose.prod.yml.
#
# THE NON-NEGOTIABLE, restated because it is the highest-impact
# misconfiguration available in this system: the application never connects as
# the schema owner or as a superuser. RLS does not apply to either, so every one
# of the 63 policies silently becomes inert while the application keeps working
# perfectly. tests/security/test_rls_isolation.py asserts this on every run.

# --- Connections -----------------------------------------------------------
# '*' is the container-internal network only. Postgres publishes no host port,
# and watiq_data is `internal: true`, so this listens on an island.
listen_addresses = '*'
port = 5432
max_connections = 200

ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file  = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.3'
ssl_prefer_server_ciphers = on

password_encryption = 'scram-sha-256'

# --- Query bounds ----------------------------------------------------------
# Bound runaway and hostile queries. A national portal cannot afford one
# expensive query holding a connection while a queue builds behind it; 5s is
# far above any legitimate query in this schema.
statement_timeout = '5s'
idle_in_transaction_session_timeout = '10s'
lock_timeout = '3s'
deadlock_timeout = '1s'

# --- Logging ---------------------------------------------------------------
log_destination = 'jsonlog'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = '1d'
log_rotation_size = '100MB'
log_connections = on
log_disconnections = on
log_lock_waits = on
log_checkpoints = on
log_temp_files = 0

# 'ddl', NEVER 'all'. With 'all', every INSERT into users writes the citizen's
# CIN, name, phone and address into a plaintext file that is backed up, shipped
# to the log aggregator, and read by anyone with operations access. The Postgres
# log would become the largest unprotected copy of the PII in the system.
log_statement = 'ddl'
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d app=%a '

# --- Audit -----------------------------------------------------------------
shared_preload_libraries = 'pgaudit,pg_stat_statements'
pgaudit.log = 'role,ddl'          # privilege and schema changes
pgaudit.log_catalog = off
# CRITICAL: with this on, every bound parameter lands in the log — which is to
# say every CIN number, every phone, every address. Same reasoning as
# log_statement above.
pgaudit.log_parameter = off

pg_stat_statements.track = 'top'
# Same rule for the statement-statistics extension: normalized query text only.
pg_stat_statements.save = off

# --- Replication / PITR ----------------------------------------------------
# WAL archiving feeds pgBackRest (ops/backup/pgbackrest.conf). replica level is
# the minimum that supports both streaming replication and PITR.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=watiq archive-push %p'
max_wal_senders = 5
wal_keep_size = '1GB'
hot_standby = on

# --- Resources -------------------------------------------------------------
shared_buffers = '2GB'
effective_cache_size = '6GB'
work_mem = '16MB'
maintenance_work_mem = '512MB'
random_page_cost = 1.1            # SSD
effective_io_concurrency = 200

# --- Autovacuum ------------------------------------------------------------
# access_log is append-only and grows monotonically; the defaults are too lazy
# for a table with that write pattern.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = '30s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

timezone = 'UTC'
lc_messages = 'C'
