# Watiq — production overlay (docker-compose.prod.yml)
#
# Used as:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Hardening follows Security.md §12.4 and Architecture.md §5:
#   - read-only rootless containers, cap_drop ALL, no-new-privileges, seccomp
#   - data tier publishes no host port; watiq_data has no internet route
#   - secrets mounted at /run/secrets/ (docker secrets), read once at startup
#   - Nginx is the ONLY host-port publisher (80/443)
#
# The dev compose definitions of postgres/redis/minio are replaced here with
# their hardened configs (ops/postgres, ops/redis). TLS certificates for
# postgres/redis/nginx must be provisioned by the operator.

services:
  nginx:
    image: nginx:1.26
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ops/nginx/snippets:/etc/nginx/snippets:ro
      - ./ops/modsecurity:/etc/nginx/modsecurity:ro
      - ./ops/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
    networks: [watiq_edge]

  api:
    image: watiq-api:${VERSION}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./ops/docker/seccomp-watiq.json
    user: "10001:10001"
    pids_limit: 256
    mem_limit: 1g
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    environment:
      ENV: prod
      DEBUG: "false"
      CORS_ORIGINS: '["https://watiq.tn"]'
    secrets:
      - dsn_citizen
      - dsn_staff
      - dsn_auth
      - dsn_auditor
      - dsn_admin
      - jwt_private_key
      - jwt_public_key
      - mfa_encryption_key
      - s3_access_key
      - s3_secret_key
      - redis_dsn
      - smtp_password
      - payment_gateway_secret
    deploy:
      replicas: 2
    networks: [watiq_edge, watiq_app, watiq_data]

  worker:
    image: watiq-api:${VERSION}
    command: ["arq", "app.workers.settings.WorkerSettings"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./ops/docker/seccomp-watiq.json
    user: "10001:10001"
    pids_limit: 256
    mem_limit: 1g
    environment:
      ENV: prod
    secrets:
      - dsn_citizen
      - dsn_staff
      - dsn_auth
      - dsn_auditor
      - dsn_admin
      - jwt_private_key
      - jwt_public_key
      - mfa_encryption_key
      - s3_access_key
      - s3_secret_key
      - redis_dsn
      - smtp_password
      - payment_gateway_secret
    deploy:
      replicas: 2
    networks: [watiq_app, watiq_data]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_pw
      POSTGRES_DB: watiq
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./ops/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgcerts:/etc/postgresql/certs:ro
    secrets:
      - postgres_superuser_pw
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    networks: [watiq_data]

  redis:
    image: redis:7.2
    volumes:
      - ./ops/redis/redis.conf:/etc/redis/redis.conf:ro
      - ./ops/redis/users.acl:/etc/redis/users.acl:ro
      - rediscerts:/tls:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    networks: [watiq_data]

  minio:
    image: minio/minio:latest
    command: server /data
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    networks: [watiq_data]

  createbuckets:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local https://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/watiq-documents &&
      mc anonymous set none local/watiq-documents &&
      mc version enable local/watiq-documents &&
      mc retention set local/watiq-documents --config-dir /tmp governance 1d
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [watiq_data]

  migrate:
    image: watiq-api:${VERSION}
    entrypoint: ["alembic", "upgrade", "head"]
    read_only: true
    cap_drop: [ALL]
    secrets:
      - dsn_migrate
    environment:
      WATIQ_MIGRATE_DSN_FILE: /run/secrets/dsn_migrate
    networks: [watiq_data]

  roles-init:
    image: postgres:15
    volumes:
      - ./ops/postgres/init/00-create-login-roles.sql:/init/00-create-login-roles.sql:ro
      - ./ops/postgres/init/00-create-login-roles.sh:/init/00-create-login-roles.sh:ro
    environment:
      CITIZEN_PW_FILE: /run/secrets/citizen_pw
      STAFF_PW_FILE: /run/secrets/staff_pw
      AUTH_PW_FILE: /run/secrets/auth_pw
      AUDITOR_PW_FILE: /run/secrets/auditor_pw
      ADMIN_PW_FILE: /run/secrets/admin_pw
    entrypoint: ["/bin/sh", "/init/00-create-login-roles.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [watiq_data]

  clamav:
    image: clamav/clamav:stable
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [watiq_app]

  # --- Observability (Architecture.md §5, watiq_obs) -------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - promdata:/prometheus
    networks: [watiq_obs, watiq_app]

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafanadata:/var/lib/grafana
    networks: [watiq_obs]

  loki:
    image: grafana/loki:latest
    volumes:
      - lokidata:/loki
    networks: [watiq_obs]

secrets:
  dsn_citizen: { file: ./secrets/dsn_citizen }
  dsn_staff: { file: ./secrets/dsn_staff }
  dsn_auth: { file: ./secrets/dsn_auth }
  dsn_auditor: { file: ./secrets/dsn_auditor }
  dsn_admin: { file: ./secrets/dsn_admin }
  dsn_migrate: { file: ./secrets/dsn_migrate }
  jwt_private_key: { file: ./secrets/jwt_private_key }
  jwt_public_key: { file: ./secrets/jwt_public_key }
  mfa_encryption_key: { file: ./secrets/mfa_encryption_key }
  s3_access_key: { file: ./secrets/s3_access_key }
  s3_secret_key: { file: ./secrets/s3_secret_key }
  redis_dsn: { file: ./secrets/redis_dsn }
  smtp_password: { file: ./secrets/smtp_password }
  payment_gateway_secret: { file: ./secrets/payment_gateway_secret }
  postgres_superuser_pw: { file: ./secrets/postgres_superuser_pw }
  minio_root_user: { file: ./secrets/minio_root_user }
  minio_root_password: { file: ./secrets/minio_root_password }
  citizen_pw: { file: ./secrets/citizen_pw }
  staff_pw: { file: ./secrets/staff_pw }
  auth_pw: { file: ./secrets/auth_pw }
  auditor_pw: { file: ./secrets/auditor_pw }
  admin_pw: { file: ./secrets/admin_pw }

volumes:
  pgdata:
  miniodata:
  certs:
  pgcerts:
  rediscerts:
  promdata:
  grafanadata:
  lokidata:

networks:
  watiq_edge: {}
  watiq_app: {}
  watiq_data:
    internal: true      # NO route to the internet from the data tier
  watiq_obs: {}
