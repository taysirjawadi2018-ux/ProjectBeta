# Watiq — development stack (docker-compose.yml)
#
# Topology mirrors Architecture.md §5: three networks, the data tier on an
# internal network with no published host ports. The single deviation is the
# API port (127.0.0.1:8000) for local development; production publishes
# nothing but 80/443 via Nginx (docker-compose.prod.yml).
#
# Bootstrap order (handled by compose dependencies, all automatic):
#   postgres (initdb: watiq_migrate + self-signed TLS) -> migrate (alembic 0001)
#   -> roles-init (LOGIN users) -> api -> worker
name: watiq-dev

services:
  pg-tls-init:
    # Generates the dev TLS certificate into PGDATA *before* postgres starts.
    #
    # 01-dev-tls.sh also sits in docker-entrypoint-initdb.d, but that directory
    # only runs when the data directory is empty. Once a database exists — after
    # any restart, or if the volume outlives a `down` — the script is skipped
    # while the command below still forces `ssl=on`, and postgres exits with
    # "could not load server certificate file". Running it as its own step
    # makes the certificate a precondition of starting rather than a side
    # effect of first-time initialisation. The script is idempotent.
    image: postgres:15
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/bash", "/init/01-dev-tls.sh"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init/01-dev-tls.sh:/init/01-dev-tls.sh:ro
    networks: [watiq_data]

  postgres:
    image: postgres:15
    depends_on:
      pg-tls-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: watiq_migrate
      POSTGRES_PASSWORD: watiq-dev-migrate
      POSTGRES_DB: watiq
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TLS on because asyncpg connects with ssl='require' (Backend.md §4.1).
    # The self-signed cert is generated by 01-dev-tls.sh into PGDATA.
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/data/certs/server.crt
      -c ssl_key_file=/var/lib/postgresql/data/certs/server.key
      -c statement_timeout=5000
      -c idle_in_transaction_session_timeout=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watiq_migrate -d watiq"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [watiq_data]

  redis:
    image: redis:7.2
    # Dev: plaintext on the internal network only. Production uses TLS + ACL
    # users (ops/redis/*) — see Security.md §10.2.
    command: redis-server --bind 0.0.0.0 --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [watiq_data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: watiq-dev
      MINIO_ROOT_PASSWORD: watiq-dev-minio
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [watiq_data]

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 watiq-dev watiq-dev-minio &&
      mc mb -p local/watiq-documents &&
      mc anonymous set none local/watiq-documents &&
      mc ilm rule add local/watiq-documents --expire-days 1 --noncurrent true 2>/dev/null || true
      "
    networks: [watiq_data]

  migrate:
    build: ./backend
    # Runs as the migration user ONLY. It owns the schema, so it must never
    # serve traffic (Structure.md §6, Security.md §10.1).
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      WATIQ_MIGRATE_DSN: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
    depends_on:
      postgres:
        condition: service_healthy
    # watiq_data is internal-only (no DNS/internet); the remote Supabase DSN
    # needs the egress route of the app tier.
    networks: [watiq_data, watiq_app]

  roles-init:
    image: postgres:15
    environment:
      PGUSER: watiq_migrate
      PGPASSWORD: watiq-dev-migrate
      CITIZEN_PW: watiq-dev-citizen
      STAFF_PW: watiq-dev-staff
      AUTH_PW: watiq-dev-auth
      AUDITOR_PW: watiq-dev-auditor
      ADMIN_PW: watiq-dev-admin
    volumes:
      - ./ops/postgres/init/00-create-login-roles.sql:/init/00-create-login-roles.sql:ro
      - ./ops/postgres/init/00-create-login-roles.sh:/init/00-create-login-roles.sh:ro
    entrypoint: ["/bin/sh", "/init/00-create-login-roles.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [watiq_data]

  api:
    build: ./backend
    environment: &api_env
      ENV: dev
      DEBUG: "false"
      DSN_CITIZEN: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      DSN_STAFF: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      DSN_AUTH: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      DSN_AUDITOR: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      DSN_ADMIN: postgresql+asyncpg://postgres.xfwqpnhfhxewzjcjoefe:ar%29Jk.ri%2B%26K9ewA@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      REDIS_DSN: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_DOCUMENTS: watiq-documents
      S3_ACCESS_KEY: watiq-dev
      S3_SECRET_KEY: watiq-dev-minio
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      roles-init:
        condition: service_completed_successfully
    # `watiq-api` is the name ops/nginx/nginx.conf resolves in its upstream
    # block. Without this alias Docker DNS only publishes `api` and nginx fails
    # to resolve its own upstream at startup.
    networks:
      watiq_edge:
        aliases: [watiq-api]
      watiq_app:
      watiq_data:

  frontend:
    build: ./frontend_flask
    # The BFF. It renders the twelve screens server-side and is the only thing
    # holding an API token — the browser never receives one (ADR-005).
    environment:
      ENV: dev
      DEBUG: "false"
      WATIQ_API_URL: http://api:8000
      REDIS_DSN: redis://session-store:6379/0
      SECRET_KEY: ${FRONTEND_SECRET_KEY:-watiq-dev-frontend-secret-change-me}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      api:
        condition: service_healthy
      session-store:
        condition: service_healthy
    # NOT on watiq_data. The BFF talks to the API over HTTP and to its own
    # session store — it has no business reaching Postgres, MinIO or the API's
    # cache, and joining the data tier just to find a Redis would hand it that
    # path for free.
    networks: [watiq_edge, watiq_app]

  session-store:
    image: redis:7.2
    # Separate from the API's Redis on purpose. It lives on the app tier rather
    # than the data tier, and holds only BFF session records: access token,
    # refresh token, expiry, CSRF token, user id and role. No citizen PII is
    # ever written here (Backend.md §7, ADR-003).
    command: redis-server --bind 0.0.0.0 --maxmemory 128mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [watiq_app]

  worker:
    build: ./backend
    command: ["arq", "app.workers.settings.WorkerSettings"]
    environment: *api_env
    depends_on:
      api:
        condition: service_healthy
    networks: [watiq_app, watiq_data]

  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [watiq_app]

volumes:
  pgdata:
  miniodata:

networks:
  # The subnet is pinned because ops/nginx/conf.d/watiq.conf trusts
  # X-Forwarded-For only from this range (set_real_ip_from). On a
  # Docker-assigned subnet that match fails, nginx falls back to the proxy's own
  # address, and every per-IP control — rate limits, CrowdSec decisions,
  # access_log attribution — silently collapses onto one address.
  #
  # 10.200.0.0/16 rather than a 172.x range on purpose: Docker auto-allocates
  # from 172.17.0.0/12 (172.17–172.31), so pinning inside that pool means
  # racing every other project on the host for the address — which is exactly
  # how this collided with a frappe network the first time. 10.200/16 is
  # outside the pool, so nothing will be auto-assigned on top of it.
  # Change here and in ops/nginx/conf.d/watiq.conf together, or XFF stops
  # being trusted.
  watiq_edge:
    ipam:
      config:
        - subnet: 10.200.0.0/16
  watiq_app: {}
  watiq_data:
    internal: true   # NO route to the internet from the data tier (Security.md §2)
