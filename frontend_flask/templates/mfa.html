{% extends "_page.html" %}

{% block title %}Watiq National Portal - Verification{% endblock %}

{% block page %}
<section class="max-w-md mx-auto">
<div class="bg-surface-container-lowest rounded-xl p-8 border border-surface-variant">
<div class="text-center mb-8">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-[48px]">verified_user</span>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 mt-4">Two-step verification</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the 6-digit code from your authenticator app to finish signing in.</p>
</div>
<form action="{{ url_for('public.mfa') }}" class="space-y-6" method="post">
<input name="csrf_token" type="hidden" value="{{ csrf_token() }}"/>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="code">Verification code</label>
<input aria-required="true" autocomplete="one-time-code" class="block w-full px-3 py-3 border border-outline-variant rounded bg-surface text-on-surface font-body-lg text-body-lg tracking-[0.5em] text-center focus-ring" id="code" inputmode="numeric" maxlength="6" name="code" pattern="[0-9]{6}" required="" type="text"/>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 px-4 rounded hover:bg-primary transition-colors focus-ring" type="submit">Verify</button>
</form>
</div>
</section>
{% endblock %}
