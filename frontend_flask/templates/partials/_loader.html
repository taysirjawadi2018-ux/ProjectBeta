{% from 'partials/_logo.html' import mark %}

  <div class="flex flex-col items-center gap-4 text-center">
    <div class="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center p-3 border border-white/20 shadow-2xl backdrop-blur-md animate-pulse">
      {{ mark(size='h-12') }}
    </div>
    <div class="flex flex-col items-center gap-1">
      <span class="text-2xl font-bold tracking-tight text-white">Watiq <span class="text-sovereign-gold font-light">Pro</span></span>
      <span class="text-[10px] uppercase tracking-[0.25em] text-white/70 font-semibold">{{ _('Republic of Tunisia') }}</span>
    </div>
    <div class="w-36 h-1 bg-white/20 rounded-full overflow-hidden mt-3">
      <div class="h-full bg-sovereign-gold animate-pulse w-full"></div>
    </div>
  </div>
</div>
